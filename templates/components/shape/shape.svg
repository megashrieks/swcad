<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- The viewBox sets the component's default size. Every element that is
       annotated needs an id; the rest is drawn as-is. -->
  <rect id="body" x="0" y="0" width="160" height="90" rx="4" fill="#ffffff" stroke="#2e3440" stroke-width="1.5" />
  <text id="title" x="80" y="45" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#2e3440">{{name}}</text>

  <!-- Ports: connectors terminate here. -->
  <circle id="p-n" cx="80" cy="0" r="3.5" fill="#5e81ac" />
  <circle id="p-e" cx="160" cy="45" r="3.5" fill="#5e81ac" />
  <circle id="p-s" cx="80" cy="90" r="3.5" fill="#5e81ac" />
  <circle id="p-w" cx="0" cy="45" r="3.5" fill="#5e81ac" />

  <!-- Invisible helpers: a resize grip and an anchor other components can hang off. -->
  <rect id="h-se" x="152" y="82" width="8" height="8" fill="none" />
  <rect id="a-top" x="78" y="-2" width="4" height="4" fill="none" />
</svg>
